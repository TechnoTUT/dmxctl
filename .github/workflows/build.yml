# CI(Mac 版以外は、すべて Linux のランナーで動かす。private リポジトリでは Windows は2倍・Mac は10倍の時間で数えられるため)
# - push(ブランチ)・PR・毎週(main): テスト(cargo test。Linux)
#   毎週の実行は、ビルドのキャッシュ(7日使わないと消える)を温めておくため
# - PR: Windows 用(Linux から MinGW でクロスビルド)・Linux 用(x86_64 / arm64)のビルドが通るかを確かめる
# - タグ(v で始まる名前。例: v0.2.0)の push: 上に加えて Mac 用もビルドし、成果物を GitHub の Release に添付する
#   git tag v0.2.0 && git push origin v0.2.0
# 成果物は実行ファイルをそのまま置く(Mac は .app がフォルダなので zip)
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 18 * * 0'

# 同じブランチ・PRに続けてpushしたら、古い実行は止める(タグのReleaseは止めない)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Linux 版のビルドに要るもの(SDL2 は cmake でソースからビルドして内蔵する)
  LINUX_DEPS: build-essential pkg-config cmake libasound2-dev libudev-dev libdrm-dev libgbm-dev libegl-dev libgles-dev

jobs:
  test:
    # テストだけなので、最適化しない設定で作る(リリース設定よりビルドが速い)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: Swatinem/rust-cache@v2
      - name: 開発用ライブラリを入れる
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: テスト
        run: cargo test

  linux:
    # 配布用の Linux 版。glibc は古い版で作ったものが新しい版でも動く(逆は動かない)ので、
    # Debian 12(glibc 2.36)のコンテナの中で作る(Debian 12 / Raspberry Pi OS Bookworm / Ubuntu 24.04 以降で動く)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:12
    steps:
      - name: 開発用ライブラリを入れる
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git $LINUX_DEPS
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ビルド
        run: ./scripts/build-linux.sh
      - name: libSDL2 を要らない(内蔵している)ことを確かめる
        run: |
          ldd dist/linux/dmxctl
          if ldd dist/linux/dmxctl | grep -q libSDL2; then echo "dmxctl が libSDL2 を必要としています"; exit 1; fi
      - run: mv dist/linux/dmxctl dist/dmxctl-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          path: dist/dmxctl-linux-${{ matrix.arch }}
          archive: false

  windows:
    # Linux から MinGW でクロスビルドする(.cargo/config.toml の設定で、追加のDLL無しで動く exe になる)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: MinGW-w64 を入れる
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: ビルド
        run: ./scripts/build-windows-mingw.sh
      - run: mv dist/windows/dmxctl.exe dist/dmxctl-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          path: dist/dmxctl-windows-x86_64.exe
          archive: false

  mac:
    # macOS のランナーは時間を10倍で数えられるので、タグのときだけ。
    # (Linux からのクロスビルドには macOS SDK が要り、Apple の規約上 Apple 製のハードウェア以外では使えない)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: Swatinem/rust-cache@v2
      - name: Mac アプリをビルド
        run: ./scripts/build-mac.sh
      - uses: actions/upload-artifact@v7
        with:
          path: dist/mac/DMX-Controller-mac.zip
          archive: false

  release:
    # タグを打ったときだけ、全部のビルドが通ったあとに Release を作る
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # このジョブはリポジトリを取ってこない(checkoutしない)ので、--repo でリポジトリを明示する
      - name: Release を作って成果物を添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
