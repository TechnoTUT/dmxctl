# CI:
# - push(ブランチ): テスト(cargo test。Windows と Linux)
# - PR: テストと、Mac用・Windows用・Linux用のビルドが通るかを確かめる
# - 毎週(main): テストだけ。ビルドのキャッシュは7日使わないと消えるので、間が空いても次のpushが速いように温めておく
# - タグ(v で始まる名前。例: v0.2.0)の push: ビルドして、成果物を GitHub の Release に添付する
#   git tag v0.2.0 && git push origin v0.2.0
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 18 * * 0'

# 同じブランチ・PRに続けてpushしたら、古い実行は止める(タグのReleaseは止めない)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # テストだけのジョブなので、最適化しない設定で作る(リリース設定よりビルドが3割ほど速い)
      - name: テスト
        run: cargo test

  mac:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Macアプリをビルド
        run: chmod +x scripts/build-mac.sh && ./scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DMX-Controller-mac
          path: dist/mac/DMX-Controller-mac.zip

  windows:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Windows版をビルド
        run: cargo build --release
      - name: zipにまとめる
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive -Force -Path target/release/dmxctl.exe -DestinationPath dist/windows/DMX-Controller-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DMX-Controller-windows
          path: dist/windows/DMX-Controller-windows.zip

  linux:
    # pushのたびにテスト(Ubuntu 26.04)。テストだけなので最適化しない設定で作る
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: 開発用ライブラリを入れる
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libsdl2-dev
      - name: テスト
        run: cargo test --features kmsdrm

  linux-build:
    # 配布用のLinux版(PR とタグのときだけ)。Ubuntu 26.04 の上で Debian 13 のコンテナを動かし、その中で作る。
    # glibc は古い版で作ったものが新しい版でも動く(逆は動かない)ので、Debian 13(glibc 2.41)で作れば
    # Debian 13 以降で動く
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    container: debian:13
    steps:
      - name: 開発用ライブラリを入れる
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config libasound2-dev libudev-dev libsdl2-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux版をビルド
        run: chmod +x scripts/build-linux.sh && ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DMX-Controller-linux
          path: dist/linux/DMX-Controller-linux.tar.gz

  release:
    # タグを打ったときだけ、全部のビルドが通ったあとにReleaseを作る
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, linux-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Releaseを作って成果物を添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/DMX-Controller-mac.zip dist/DMX-Controller-windows.zip dist/DMX-Controller-linux.tar.gz
