# CI. Everything except the macOS build runs on Linux runners, because private
# repositories bill Windows minutes at 2x and macOS minutes at 10x.
# - push (branch): tests only (cargo test on Linux)
# - pull request: tests, plus Windows (cross-built from Linux with MinGW) and
#   Linux (x86_64 / arm64) builds. Tests also run here because a PR from a fork
#   does not show the fork's push results.
# - push of a tag starting with "v" (e.g. v0.2.0): build macOS and attach all
#   executables to a GitHub Release.
#   git tag v0.2.0 && git push origin v0.2.0
#   The Linux / Windows executables are reused from the pull request run that
#   built exactly the same source tree (see pr-record / reuse). If there is none
#   (main moved after the PR, or the artifacts expired), they are built again.
# Artifacts are the executables themselves, not archives (macOS ships a zip
# because the .app bundle is a directory).
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# Cancel older runs for the same branch or PR (never cancel a tag release)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Build dependencies for Linux (SDL2 is built from source with cmake and linked statically)
  LINUX_DEPS: build-essential pkg-config cmake libasound2-dev libudev-dev libdrm-dev libgbm-dev libegl-dev libgles-dev libxext-dev

jobs:
  reuse:
    # Tags only: find a pull request run that built the same source tree as the tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          echo "source tree: $tree"
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=source-tree-$tree" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          if [ -n "$run_id" ]; then
            # Every executable must still be there, otherwise build again
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '[.artifacts[] | select((.expired | not) and (.name | startswith("dmxctl-")))] | length')
            [ "$count" = 3 ] || { echo "run $run_id has $count of 3 executables; building again"; run_id=""; }
          fi
          echo "reusing run: ${run_id:-none}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  test:
    # Debug profile: builds faster than release, and tests don't need optimization
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: Test
        run: cargo test

  linux:
    # Release builds for Linux. Binaries built against an older glibc run on newer
    # ones (not the other way around), so build inside Debian 12 (glibc 2.36).
    # Runs on Debian 12 / Raspberry Pi OS Bookworm / Ubuntu 24.04 and later.
    needs: reuse
    # !cancelled() keeps the job from being skipped when reuse is skipped (pull requests)
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (needs.reuse.result == 'success' && needs.reuse.outputs.run_id == '')) }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:12
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git $LINUX_DEPS
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: ./scripts/build-linux.sh
      - name: Check that libSDL2 is not a runtime dependency
        run: |
          ldd dist/linux/dmxctl
          if ldd dist/linux/dmxctl | grep -q libSDL2; then echo "dmxctl depends on libSDL2; it should be linked statically"; exit 1; fi
      - name: Rename
        run: mv dist/linux/dmxctl dist/dmxctl-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          path: dist/dmxctl-linux-${{ matrix.arch }}
          archive: false

  windows:
    # Cross-built from Linux with MinGW. .cargo/config.toml links the runtime
    # statically, so the exe needs no extra DLLs.
    needs: reuse
    # !cancelled() keeps the job from being skipped when reuse is skipped (pull requests)
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (needs.reuse.result == 'success' && needs.reuse.outputs.run_id == '')) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build
        run: ./scripts/build-windows-mingw.sh
      - name: Rename
        run: mv dist/windows/dmxctl.exe dist/dmxctl-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          path: dist/dmxctl-windows-x86_64.exe
          archive: false

  mac:
    # Tags only, since macOS minutes are billed at 10x. (Cross-building from Linux
    # would need the macOS SDK, which Apple licenses for Apple hardware only.)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: ./scripts/build-mac.sh
      - uses: actions/upload-artifact@v7
        with:
          path: dist/mac/DMX-Controller-mac.zip
          archive: false

  pr-record:
    # Pull requests only: once tests and builds pass, leave a marker named after the
    # source tree, so a tag on the same tree can reuse this run's executables
    if: github.event_name == 'pull_request'
    needs: [test, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          echo "TREE=$tree" >> "$GITHUB_ENV"
          echo "$GITHUB_SHA" > source-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: source-tree-${{ env.TREE }}
          path: source-commit.txt

  release:
    # Tags only: create the Release once every executable is ready
    needs: [reuse, linux, windows, mac]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.reuse.result == 'success' && needs.mac.result == 'success'
      && (needs.reuse.outputs.run_id != '' || (needs.linux.result == 'success' && needs.windows.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # Download through the REST API: artifacts uploaded with archive: false come back
      # as the file itself (gh run download expects a zip and fails on them)
      - name: Collect executables
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ needs.reuse.outputs.run_id }}
        run: |
          mkdir dist
          fetch() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts?per_page=100" \
              --jq '.artifacts[] | select((.expired | not) and (.name | test("^(dmxctl-|DMX-Controller-)"))) | "\(.id) \(.name)"' |
            while read -r id name; do
              echo "run $1: $name"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "dist/$name"
            done
          }
          fetch "$GITHUB_RUN_ID"
          [ -z "$REUSE_RUN" ] || fetch "$REUSE_RUN"
          ls -la dist
          [ "$(ls dist | wc -l)" = 4 ] || { echo "expected 4 files"; exit 1; }
      # This job doesn't check out the repository, so pass --repo explicitly
      - name: Create the release and attach executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
