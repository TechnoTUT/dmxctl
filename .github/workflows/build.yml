# CI:
# - push(ブランチ): テスト(cargo test)だけ
# - PR: テストと、Mac用・Windows用のビルドが通るかを確かめる
# - タグ(v で始まる名前。例: v0.2.0)の push: ビルドして、成果物を GitHub の Release に添付する
#   git tag v0.2.0 && git push origin v0.2.0
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: テスト
        run: cargo test --release

  mac:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Macアプリをビルド
        run: chmod +x scripts/build-mac.sh && ./scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DMX-Controller-mac
          path: dist/mac/DMX-Controller-mac.zip

  windows:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows版をビルド
        run: cargo build --release
      - name: zipにまとめる
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive -Force -Path target/release/dmxctl.exe -DestinationPath dist/windows/DMX-Controller-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DMX-Controller-windows
          path: dist/windows/DMX-Controller-windows.zip

  release:
    # タグを打ったときだけ、両方のビルドが通ったあとにReleaseを作る
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Releaseを作って成果物を添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/DMX-Controller-mac.zip dist/DMX-Controller-windows.zip
