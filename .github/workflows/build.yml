# CI. Everything except the macOS build runs on Linux runners, because private
# repositories bill Windows minutes at 2x and macOS minutes at 10x.
# - push (branch): tests only (cargo test on Linux)
# - pull request: tests, plus Windows (cross-built from Linux with MinGW) and
#   Linux (x86_64 / arm64) builds. Tests also run here because a PR from a fork
#   does not show the fork's push results.
# - push of a tag starting with "v" (e.g. v0.2.0): the builds above plus macOS,
#   attached to a GitHub Release.
#   git tag v0.2.0 && git push origin v0.2.0
# Artifacts are the executables themselves, not archives (macOS ships a zip
# because the .app bundle is a directory).
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# Cancel older runs for the same branch or PR (never cancel a tag release)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Build dependencies for Linux (SDL2 is built from source with cmake and linked statically)
  LINUX_DEPS: build-essential pkg-config cmake libasound2-dev libudev-dev libdrm-dev libgbm-dev libegl-dev libgles-dev libxext-dev

jobs:
  test:
    # Debug profile: builds faster than release, and tests don't need optimization
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: Test
        run: cargo test

  linux:
    # Release builds for Linux. Binaries built against an older glibc run on newer
    # ones (not the other way around), so build inside Debian 12 (glibc 2.36).
    # Runs on Debian 12 / Raspberry Pi OS Bookworm / Ubuntu 24.04 and later.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:12
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git $LINUX_DEPS
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: ./scripts/build-linux.sh
      - name: Check that libSDL2 is not a runtime dependency
        run: |
          ldd dist/linux/dmxctl
          if ldd dist/linux/dmxctl | grep -q libSDL2; then echo "dmxctl depends on libSDL2; it should be linked statically"; exit 1; fi
      - name: Rename
        run: mv dist/linux/dmxctl dist/dmxctl-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          path: dist/dmxctl-linux-${{ matrix.arch }}
          archive: false

  windows:
    # Cross-built from Linux with MinGW. .cargo/config.toml links the runtime
    # statically, so the exe needs no extra DLLs.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build
        run: ./scripts/build-windows-mingw.sh
      - name: Rename
        run: mv dist/windows/dmxctl.exe dist/dmxctl-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          path: dist/dmxctl-windows-x86_64.exe
          archive: false

  mac:
    # Tags only, since macOS minutes are billed at 10x. (Cross-building from Linux
    # would need the macOS SDK, which Apple licenses for Apple hardware only.)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: ./scripts/build-mac.sh
      - uses: actions/upload-artifact@v7
        with:
          path: dist/mac/DMX-Controller-mac.zip
          archive: false

  release:
    # Tags only: create the Release once every build has passed
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # This job doesn't check out the repository, so pass --repo explicitly
      - name: Create the release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
