# Linux tests and x86_64 build on the self-hosted runner (runs-on: k8s), so they
# don't use the GitHub-hosted minutes that private repositories are limited to.
# The jobs mirror the test and linux (x86_64) jobs of build.yml; build.yml stays
# as it is and still makes the releases. arm64 is left to build.yml, since the
# k8s cluster has no arm64 runner.
# - push to main: tests only. Other branches are tested through their pull request,
#   so a PR does not run the same tests twice.
# - pull request: tests and the Linux x86_64 build.
# Each job runs inside a Debian container, so the runner needs no extra packages.
# Note: pull_request runs the PR's code on the k8s cluster. That is fine while the
# repository is private, but take care before accepting PRs from outside.
name: self-hosted

on:
  push:
    branches: [main]
  pull_request:

# Cancel older runs for the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same as build.yml (SDL2 is built from source with cmake and linked statically)
  LINUX_DEPS: build-essential pkg-config cmake libasound2-dev libudev-dev libdrm-dev libgbm-dev libegl-dev libgles-dev libxext-dev

jobs:
  test:
    # Debug profile: builds faster than release, and tests don't need optimization
    runs-on: k8s
    container: debian:12
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git $LINUX_DEPS
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test

  linux:
    # Release build for Linux x86_64, inside Debian 12 (glibc 2.36) like build.yml.
    # Runs on Debian 12 / Ubuntu 24.04 and later.
    if: github.event_name == 'pull_request'
    runs-on: k8s
    container: debian:12
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git $LINUX_DEPS
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: ./scripts/build-linux.sh
      - name: Check that libSDL2 is not a runtime dependency
        run: |
          ldd dist/linux/dmxctl
          if ldd dist/linux/dmxctl | grep -q libSDL2; then echo "dmxctl depends on libSDL2; it should be linked statically"; exit 1; fi
      - name: Rename
        run: mv dist/linux/dmxctl dist/dmxctl-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          path: dist/dmxctl-linux-x86_64
          archive: false
