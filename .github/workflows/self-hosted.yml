# Linux のテストと x86_64 のビルドを、k8s の self-hosted runner で動かす。
# private リポジトリでは、GitHub の runner を使える時間に限りがあるため。
# 手順は build.yml の test ジョブと linux ジョブの x86_64 と同じにしている。
# build.yml はそのまま残し、Release も build.yml が作る。
# k8s に arm64 の runner は無いので、arm64 は build.yml に任せる。
# - main への push: テストだけ。ほかのブランチは PR でテストするので、PR でテストが2回動かない
# - PR: テストと、Linux の x86_64 用のビルド
# どのジョブも Debian のコンテナの中で動くので、runner に何かを入れる必要は無い。
# 気をつけること: pull_request では、PR のコードが k8s の上で動く。
# private のあいだは問題ないが、外の人の PR を受けるようになったら考え直す。
name: self-hosted

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチや PR に続けて push したら、古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # build.yml と同じ。SDL2 はソースから cmake でビルドして、静的にリンクする
  LINUX_DEPS: build-essential pkg-config cmake libasound2-dev libudev-dev libdrm-dev libgbm-dev libegl-dev libgles-dev libxext-dev

jobs:
  test:
    # テストだけなので、最適化しない設定で作る。リリースの設定より速くビルドできる
    runs-on: k8s
    container: debian:12
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git $LINUX_DEPS
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test

  linux:
    # Linux の x86_64 用のリリースビルド。build.yml と同じく Debian 12 の中で作る。
    # glibc 2.36 で作るので、Debian 12 や Ubuntu 24.04 以降で動く
    if: github.event_name == 'pull_request'
    runs-on: k8s
    container: debian:12
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git $LINUX_DEPS
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: ./scripts/build-linux.sh
      - name: Check that libSDL2 is not a runtime dependency
        run: |
          ldd dist/linux/dmxctl
          if ldd dist/linux/dmxctl | grep -q libSDL2; then echo "dmxctl depends on libSDL2; it should be linked statically"; exit 1; fi
      - name: Rename
        run: mv dist/linux/dmxctl dist/dmxctl-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          path: dist/dmxctl-linux-x86_64
          archive: false
