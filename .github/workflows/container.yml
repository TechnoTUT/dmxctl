# Container image (Containerfile). Built with Docker Buildx, which reads Containerfile as-is.
# - pull request: build the image and run `dmxctl help` inside it. Nothing is pushed.
# - push of a tag starting with "v" (e.g. v0.2.0): build and push to GHCR as
#   ghcr.io/technotut/dmxctl:0.2.0 (the "v" is dropped, as the Infra manifests expect).
#   git tag v0.2.0 && git push origin v0.2.0
name: container

on:
  pull_request:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write   # needed to push to GHCR (tags only)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dmxctl
          tags: |
            type=semver,pattern={{version}}

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          tags: ${{ steps.meta.outputs.tags || 'dmxctl:ci' }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: docker run --rm dmxctl:ci help
