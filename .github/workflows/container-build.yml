# Reusable: build the container image from Containerfile on the given runner.
# Called by container.yml.
name: container-build

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runner labels, e.g. ["ubuntu-26.04"]
        required: true
        type: string
      push:
        description: Push to GHCR (tags and main only)
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
      packages: write   # needed to push to GHCR (tags and main only)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dmxctl
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on tags and main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          tags: ${{ steps.meta.outputs.tags || 'dmxctl:ci' }}
          load: ${{ !inputs.push }}
          push: ${{ inputs.push }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: ${{ !inputs.push }}
        run: docker run --rm dmxctl:ci help
