[package]
name = "spot4"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland"] }
midir = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = "4.10.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
