[package]
name = "dmxctl"
version = "0.2.0"
edition = "2024"
default-run = "dmxctl"

# 層ごとのクレート。参照してよい向きは ui → backend → core だけ
[workspace]
members = ["crates/*"]
# 引数なしの cargo test などで、全部のクレートを対象にする
default-members = [".", "crates/*"]
# サブモジュールは、自分で workspace を持つ
exclude = ["moip-engine"]

[dependencies]
dmxctl-core = { path = "crates/core" }
dmxctl-backend = { path = "crates/backend" }
dmxctl-ui = { path = "crates/ui" }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
serde_json = "1.0.151"

[dev-dependencies]
dmxctl-core = { path = "crates/core", features = ["test-support"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
