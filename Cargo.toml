[package]
name = "dmxctl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
libloading = "0.9.0"
midir = "0.11.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = "4.10.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
cc = "1.4.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
