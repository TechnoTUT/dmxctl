[package]
name = "dmxctl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
libloading = "0.9.0"
# NDI受信(moip-engine の ndi クレート。libndi は実行時に読み込む)
moip-ndi = { package = "ndi", git = "https://github.com/TechnoTUT/moip-engine", rev = "8cb6110105162db182e7fc7561ad9de584d58918" }
midir = "0.11.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1"
serialport = "4.10.1"

[features]
# デスクトップ環境の無いLinuxで、画面(KMS/DRM)に直接出す(SDL2を使う。libsdl2-dev が要る)
kmsdrm = ["dep:sdl2", "dep:egui_glow", "dep:glow"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
cc = "1.4.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
egui_glow = { version = "0.36.2", default-features = false, optional = true }
glow = { version = "0.17.0", optional = true }
sdl2 = { version = "0.38.0", optional = true }
