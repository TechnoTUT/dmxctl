# dmxctl を Kubernetes に置く一式。使い方は docs/container.md
#   kubectl create namespace dmxctl
#   kubectl apply -k deploy/kubernetes
# Infra の Argo CD で動かすときは、このディレクトリを k8s/manifest/dmxctl/ にコピーし、
# argocd-application.example.yaml を k8s/manifest/apps/dmxctl.yaml にする
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dmxctl
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
