<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DMX 操作パネル</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --dim:#9aa1b1; --accent:#3ad6b5; --warn:#f2b33d; --danger:#e5484d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; padding:12px 16px 40px; }
  h1 { font-size:18px; margin:4px 0 10px; display:flex; align-items:center; gap:8px; }
  h2 { font-size:14px; color:var(--dim); margin:0 0 8px; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chips span { background:#232836; border-radius:999px; padding:3px 10px; font-size:13px; color:var(--dim); }
  .chips span.ok { color:var(--accent); } .chips span.warn { color:var(--warn); } .chips span.bad { color:var(--danger); }
  button { font:inherit; color:var(--text); background:#232836; border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:64px; cursor:pointer; touch-action:manipulation; user-select:none; }
  button:active { transform:scale(.97); }
  button.on { background:var(--accent); color:#06231d; border-color:var(--accent); font-weight:700; }
  button.big { flex:1 1 30%; min-width:0; padding:18px 4px; font-size:15px; font-weight:700; white-space:nowrap; }
  #blackout.on { background:var(--danger); border-color:var(--danger); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:8px; }
  .swatch { width:34px; height:34px; border-radius:8px; border:1px solid var(--line); display:inline-block; vertical-align:middle; }
  .color { padding:10px 4px; font-size:13px; border:2px solid transparent; font-weight:600; }
  input[type=range] { flex:1; accent-color:var(--accent); height:32px; }
  .warnbox { border-color:var(--warn); color:var(--warn); display:none; }
  .seg button { flex:1; }
  .small { font-size:12px; color:var(--dim); }
  #pinbox { display:none; }
  input[type=password] { font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); background:#232836; color:var(--text); flex:1; }
</style>
</head>
<body>
<h1>💡 DMX 操作パネル <span id="conn" class="small"></span></h1>

<div class="card" id="pinbox">
  <h2>合言葉</h2>
  <div class="row"><input id="pin" type="password" placeholder="アプリで決めた合言葉"><button onclick="savePin()">入る</button></div>
</div>

<div class="card warnbox" id="emergency" style="border-color:var(--danger);color:var(--danger)">安全停止中です。アプリを起動し直してください</div>
<div class="card warnbox" id="bltwarn"></div>

<div class="card">
  <div class="row chips" id="chips"></div>
</div>

<div class="card">
  <div class="row">
    <button class="big" id="blackout" onclick="send({cmd:'blackout'})">BLACKOUT</button>
    <button class="big" id="fade" onclick="send({cmd:'fade'})">暗転</button>
    <button class="big" id="flash">FLASH</button>
  </div>
  <div class="row" style="margin-top:10px">
    <span class="small">全体光量</span>
    <input type="range" id="master" min="0" max="100" step="1">
    <span id="masterv" style="width:44px;text-align:right">100%</span>
  </div>
  <div class="row" style="margin-top:6px">
    <button onclick="send({cmd:'tap'})">TAP</button>
    <button onclick="send({cmd:'resync'})">頭出し</button>
    <span class="small" id="bpm"></span>
  </div>
</div>

<div class="card">
  <h2>オート</h2>
  <div class="row">
    <button id="auto" onclick="send({cmd:'auto'})">オート</button>
    <button id="resume" style="display:none" onclick="send({cmd:'auto_resume'})">オートに戻す</button>
    <span id="autostate" class="small"></span>
  </div>
  <h2 style="margin-top:12px">プリセット</h2>
  <div class="row seg" id="presets"></div>
  <h2 style="margin-top:12px">フレーズを試す</h2>
  <div class="grid" id="phrases"></div>
</div>

<div class="card">
  <h2>色 <span class="small">(選ぶと、しばらくオートより優先)</span></h2>
  <div class="row" style="margin-bottom:8px">
    <button id="slot-main" class="on" onclick="slot='main';render()">メイン <span class="swatch" id="sw-main"></span></button>
    <button id="slot-sub" onclick="slot='sub';render()">サブ <span class="swatch" id="sw-sub"></span></button>
    <button onclick="send({cmd:'swap'})">入れ替え</button>
  </div>
  <div class="grid" id="colors"></div>
</div>

<div class="card" id="scenecard">
  <h2>シーン</h2>
  <div class="grid" id="scenes"></div>
</div>

<p class="small">このページは dmxctl が出しています。1秒ごとに様子を読み直します。</p>

<script>
let st = null, slot = 'main', busy = false;
const $ = id => document.getElementById(id);
const pin = () => { try { return localStorage.getItem('dmxpin') || ''; } catch (e) { return ''; } };
function savePin() { try { localStorage.setItem('dmxpin', $('pin').value); } catch (e) {} $('pinbox').style.display = 'none'; poll(); }
async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'X-Pin': pin() }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { $('pinbox').style.display = 'block'; throw new Error('pin'); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
async function send(cmd) {
  try { st = await api('/api/cmd', cmd); render(); } catch (e) { if (e.message !== 'pin') $('conn').textContent = '⚠ ' + e.message; }
}
async function poll() {
  if (busy) return;
  busy = true;
  try { st = await api('/api/state'); $('conn').textContent = ''; render(); }
  catch (e) { if (e.message !== 'pin') $('conn').textContent = '⚠ つながりません'; }
  busy = false;
}
const rgb = c => c ? `rgb(${c[0]},${c[1]},${c[2]})` : 'transparent';
function btn(label, on, fn, style) { const b = document.createElement('button'); b.textContent = label; if (on) b.classList.add('on'); b.onclick = fn; if (style) b.setAttribute('style', style); return b; }
// ボタンの並びをそろえる。並び(名前・順番・見た目)が前と同じなら作り直さず、選ばれている印だけを書き換える。
// 1秒ごとの読み直しのたびに作り直すと、押している最中のボタンが消えて、押した操作が送られないことがあるため
function syncButtons(el, items) {
  const sig = JSON.stringify(items.map(i => [i.key, i.label, i.style || '', i.cls || '']));
  if (el.dataset.sig !== sig) {
    el.innerHTML = '';
    for (const i of items) { const b = btn(i.label, i.on, i.fn, i.style); if (i.cls) b.classList.add(i.cls); el.appendChild(b); }
    el.dataset.sig = sig;
  } else {
    [...el.children].forEach((b, n) => b.classList.toggle('on', !!items[n].on));
  }
}
function render() {
  if (!st) return;
  const a = st.auto;
  $('emergency').style.display = st.emergency ? 'block' : 'none';
  const missing = a.enabled && st.blt.startsWith('⚠');
  $('bltwarn').style.display = missing ? 'block' : 'none';
  $('bltwarn').textContent = st.blt;
  const chips = [];
  chips.push([a.enabled ? (a.manual != null ? '✋ 手動優先' : a.online ? '● 曲を受信中' : '○ 待機(薄い水色)') : 'オート OFF', a.enabled && a.online && a.manual == null ? 'ok' : '']);
  chips.push(['BPM ' + st.bpm.toFixed(1), '']);
  chips.push(['Link ' + st.link_peers, st.link_peers > 0 ? 'ok' : '']);
  if (a.phrase) chips.push(['フレーズ ' + a.phrase, '']);
  const bad = st.outputs.filter(s => s !== '無効' && /エラー|失敗|切断|開けません/.test(s)).length;
  chips.push(['出力 ' + (bad ? 'エラー ' + bad : 'OK'), bad ? 'bad' : 'ok']);
  $('chips').innerHTML = '';
  for (const [t, c] of chips) { const s = document.createElement('span'); s.textContent = t; if (c) s.className = c; $('chips').appendChild(s); }
  $('blackout').classList.toggle('on', st.blackout);
  $('fade').classList.toggle('on', st.fading);
  if (document.activeElement !== $('master')) $('master').value = Math.round(st.master * 100);
  $('masterv').textContent = Math.round(st.master * 100) + '%';
  $('bpm').textContent = 'BPM ' + st.bpm.toFixed(1);
  $('auto').classList.toggle('on', a.enabled);
  $('auto').textContent = a.enabled ? 'オート ON' : 'オート OFF';
  $('resume').style.display = a.manual != null ? '' : 'none';
  $('autostate').textContent = a.manual != null ? `手動優先 あと${Math.ceil(a.manual)}秒` : (a.online ? `盛り上がり ${Math.round(a.energy * 100)}%` : '');
  syncButtons($('presets'), a.presets.map((n, i) => ({ key: i, label: n, on: i === a.preset, fn: () => send({ cmd: 'preset', index: i }) })));
  syncButtons($('phrases'), st.phrases.map(p => ({ key: p.key, label: p.label, on: a.look === p.key, fn: () => send({ cmd: 'look', phrase: p.key }) })));
  $('sw-main').style.background = rgb(st.main);
  $('sw-sub').style.background = rgb(st.sub);
  $('slot-main').classList.toggle('on', slot === 'main');
  $('slot-sub').classList.toggle('on', slot === 'sub');
  // 明るい色のボタンは黒い文字で。押したときの slot は、押した時点のもの
  const ink = c => (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) > 150 ? '#111' : '#fff';
  syncButtons($('colors'), st.colors.map(c => ({ key: c.name, label: c.label, on: false, cls: 'color', style: `background:${rgb(c.rgb)};color:${ink(c.rgb)}`, fn: () => send({ cmd: 'color', slot, name: c.name }) })));
  $('scenecard').style.display = st.scenes.length ? '' : 'none';
  syncButtons($('scenes'), st.scenes.map(n => ({ key: n, label: n, on: st.last_scene === n, fn: () => send({ cmd: 'scene', name: n }) })));
}
// 全体光量: 動かしている間は少し間を空けて送る
let mt = null;
$('master').addEventListener('input', e => { $('masterv').textContent = e.target.value + '%'; clearTimeout(mt); mt = setTimeout(() => send({ cmd: 'master', value: e.target.value / 100 }), 60); });
// FLASH: 押している間だけ
const fl = $('flash');
const flashOn = e => { e.preventDefault(); fl.classList.add('on'); send({ cmd: 'flash', on: true }); };
const flashOff = e => { if (!fl.classList.contains('on')) return; e.preventDefault(); fl.classList.remove('on'); send({ cmd: 'flash', on: false }); };
fl.addEventListener('pointerdown', flashOn);
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => fl.addEventListener(t, flashOff));
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
