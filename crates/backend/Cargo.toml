[package]
name = "dmxctl-backend"
version = "0.1.0"
edition = "2024"
description = "dmxctl のバックエンド層。画面なしの起動・保存・遠隔操作・ブラウザの操作パネル・CLI。画面に依存しない"

[dependencies]
dmxctl-core = { path = "../core" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2"

[dev-dependencies]
dmxctl-core = { path = "../core", features = ["test-support"] }
