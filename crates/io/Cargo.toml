[package]
name = "dmxctl-io"
version = "0.1.0"
edition = "2024"
description = "dmxctl の入出力層。USB-DMX・Art-Net の送出、Carabiner への接続など。エンジンの状態に触れない"

[dependencies]
dmxctl-model = { path = "../model" }
anyhow = "1.0.104"
libloading = "0.9.0"
midir = "0.11.0"
# NDI受信(moip-engine の ndi クレート。サブモジュール moip-engine/。libndi は実行時に読み込む)
moip-ndi = { package = "ndi", path = "../../moip-engine/ndi" }
serialport = "4.10.1"
# Carabiner のダウンロードで、チェックサムの確認と展開に使う
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
flate2 = "1"

[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
# 他のクレートのテストが使う、Carabiner のふりをするサーバーなどを公開する
test-support = []
